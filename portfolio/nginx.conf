server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html zawsze swiezy - wskazuje na nowe, zahashowane pliki po deployu
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # zahashowane assety Vite mozna cache'owac dlugo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
