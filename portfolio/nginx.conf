server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # kompresja tekstowych zasobow (JS/CSS/SVG/JSON) - obrazy i fonty sa juz skompresowane
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html zawsze swiezy - wskazuje na nowe, zahashowane pliki po deployu
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # zahashowane assety Vite mozna cache'owac dlugo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
